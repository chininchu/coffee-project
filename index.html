<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'sha256-vvt4KWwuNr51XfE5m+hzeNEGhiOfZzG97ccfqGsPwvE='; style-src 'self' https://cdn.jsdelivr.net; img-src 'self'; connect-src 'self' https://cdn.jsdelivr.net ws:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <title>Better Coffee</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-1BmE4kWBq78iYhFldvKuhfTAU6auU8tT94WrHftjDbrCEXSU1oBoqyl2QvZ6jIW3"
      crossorigin="anonymous"
    />
  </head>
  <body>
    <h1 class="text-center">Better Coffee&trade;</h1>

    <div class="container">
      <div class="row">
        <div class="col-lg-7">
          <div class="list-header">
            <h3>Coffee List</h3>
            <button id="reset-filters" type="button">Reset filters</button>
          </div>
          <p id="coffee-status" aria-live="polite"></p>
          <div id="coffee-list" class="coffee-grid" aria-live="polite"></div>
        </div>
        <div class="col-lg-5">
          <form id="search-form" class="Form">
            <label for="roast-selection">Roast</label>
            <select id="roast-selection" class="form-control" required>
              <option>All</option>
              <option>light</option>
              <option>medium</option>
              <option>dark</option>
            </select>

            <div class="form-group">
              <label for="inputbox">Coffee Name</label>
              <input
                id="inputbox"
                type="text"
                class="form-control"
                placeholder="Coffee Name"
                maxlength="80"
              />
            </div>
            <button id="searchbtn" type="submit">Search</button>
          </form>

          <form id="add-form" class="Form">
            <hr />

            <h2 class="text-center mt-4">Add a Coffee</h2>

            <label for="roast">Roast</label>
            <select id="roast" class="form-control" required>
              <option>Light</option>
              <option>Medium</option>
              <option>Dark</option>
            </select>

            <div class="form-group">
              <label for="new-coffee-name">Name</label>
              <input
                type="text"
                class="form-control"
                id="new-coffee-name"
                placeholder="Coffee Name"
                maxlength="80"
                required
              />
            </div>
            <button id="submit" type="submit">Add Coffee</button>
          </form>
          <h2 class="text-center mt-5">Coffee runs on sustainability</h2>
          <img
            src="img/coffee_pollfinal-copy3.webp"
            alt="Coffee sustainability"
          />
        </div>
      </div>
    </div>

    <script src="main.js"></script>
  </body>
</html>
